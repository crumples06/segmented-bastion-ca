name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]

env:
  CI_CA_PASSWORD: ci-throwaway-pw

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 
        uses: actions/checkout@v4

      - name: Write .env
        run: printf 'CA_PASSWORD=%s\nVAULT_PASSWORD=ci-vault\n' "$CI_CA_PASSWORD" > .env

      - name: Start CA 
        run: docker compose up -d ca --wait

      - name: Allow short-lived certs on the CI CA
        run: |
          docker compose cp ca:/home/step/config/ca.json ca.json
          jq '.authority.provisioners |= map(
                if .name == "admin"
                then .claims = ((.claims // {}) + {"minUserSSHCertDuration": "30s"})
                else . end)' ca.json > ca.new.json
          docker compose cp ca.new.json ca:/home/step/config/ca.json
          docker compose restart ca
          rm -f ca.json ca.new.json

      - name: Bootstrap lab
        run: bash scripts/bootstrap.sh

      - name: Issue test user certificate
        run: KEY_ID=ci-user bash scripts/login.sh

      - name: Positive Tests
        run: bash ci/positive-tests.sh

      - name: Negative Tests
        run: bash ci/negative-tests.sh

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v