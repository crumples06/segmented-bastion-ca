services:
    bastion:
        build: .
        networks:
            - private
            - public
        ports:
            - "2222:22"
        command: 
        container_name: bastion
        volumes:
            - bastion_host_keys:/etc/ssh/host_keys
    
    server1:
        build: .
        networks:
            - private
        container_name: server1
        volumes:
            - server1_host_keys:/etc/ssh/host_keys

    server2:
        build: .
        networks:
            - private
        container_name: server2
        volumes:
          - server2_host_keys:/etc/ssh/host_keys



networks:
  private:
    internal: true
    name: private

  public:

volumes:
  bastion_host_keys:
  server1_host_keys:
  server2_host_keys:
